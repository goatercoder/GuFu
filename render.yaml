# One-click deploy on Render: https://render.com/deploy?repo=https://github.com/goatercoder/GuFu
services:
  - type: web
    name: gufu
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Render asks for this at deploy time. Format: "GuFu/0.1 (Your Name; you@example.com)".
      # Leave it blank and the app asks for name + email in the browser instead.
      - key: GUFU_SEC_USER_AGENT
        sync: false
      # The free plan has a small ephemeral disk; skip storing raw SEC documents.
      - key: GUFU_KEEP_RAW_FACTS
        value: "0"
      - key: GUFU_SEC_CONCURRENCY
        value: "2"
