[project]
name = "bulwark-backend"
version = "0.1.0"
description = "Bulwark - CMMC Level 2 / NIST SP 800-171 compliance automation backend"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Header",
  "fastapi.Body",
  "fastapi.Path",
  "fastapi.File",
  "fastapi.Form",
  "fastapi.Cookie",
]

[tool.ruff.lint.isort]
known-first-party = ["bulwark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]
